name: r
on:
  workflow_dispatch:
    inputs:
      seq:
        description: next_seq target
        required: false
        default: "1"
permissions:
  contents: read
jobs:
  reset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: r
        env:
          KEY_7: ${{ secrets.KEY_7 }}
          SEQ: ${{ github.event.inputs.seq }}
        run: |
          pip install -q pymongo
          python reset_seq.py
