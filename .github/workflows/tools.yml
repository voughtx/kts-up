name: tools
on:
  workflow_dispatch:
    inputs:
      script:
        description: "script name (fix_captions.py / sync_missing.py / ...)"
        required: true
      limit:
        description: "optional limit"
        required: false
        default: "200"
      pin_mid:
        description: "poster mid to pin (optional)"
        required: false
        default: ""
      mids:
        description: "comma mids to inspect (optional)"
        required: false
        default: ""
      link_id:
        description: "links table id (optional)"
        required: false
        default: "movie_test"
      out_name:
        description: "joined output filename (optional)"
        required: false
        default: ""
      movie_id:
        description: "movie id for poster test (optional)"
        required: false
        default: ""
      pin:
        description: "pin poster? 1/0"
        required: false
        default: "0"
      link_ids:
        description: "comma link ids to delete (optional)"
        required: false
        default: ""
      pub:
        description: "public channel username (optional)"
        required: false
        default: ""
      exp_h:
        description: "link expiry hours"
        required: false
        default: "24"
      workers:
        description: "parallel download workers"
        required: false
        default: "8"
      ep_id:
        description: "episode id to delete (optional)"
        required: false
        default: ""
      ep_ids:
        description: "comma episode ids to delete (optional)"
        required: false
        default: ""
concurrency:
  group: run-task
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: pip cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-tools-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            pip-tools-${{ runner.os }}-
      - name: deps
        run: pip install -q pymongo[srv] pyrogram TgCrypto telethon || true
      - name: run tool
        env:
          KEY_1: ${{ secrets.KEY_1 }}
          KEY_2: ${{ secrets.KEY_2 }}
          KEY_7: ${{ secrets.KEY_7 }}
          KEY_13: ${{ secrets.KEY_13 }}
          KEY_16: ${{ secrets.KEY_16 }}
          KEY_17: ${{ secrets.KEY_17 }}
          KEY_18: ${{ secrets.KEY_18 }}
          KEY_22: ${{ secrets.KEY_22 }}
          KEY_23: ${{ secrets.KEY_23 }}
          KEY_24: ${{ secrets.KEY_24 }}
          KEY_25: ${{ secrets.KEY_25 }}
          KEY_26: ${{ secrets.KEY_26 }}
          KEY_27: ${{ secrets.KEY_27 }}
          KEY_32: ${{ secrets.KEY_32 }}
          KEY_33: ${{ secrets.KEY_33 }}
          KEY_34: ${{ secrets.KEY_34 }}
          KEY_35: ${{ secrets.KEY_35 }}
          KEY_36: ${{ secrets.KEY_36 }}
          KEY_37: ${{ secrets.KEY_37 }}
          KEY_19: ${{ secrets.KEY_19 }}
          KEY_8: ${{ secrets.KEY_8 }}
          KEY_20: ${{ secrets.KEY_20 }}
          KEY_21: ${{ secrets.KEY_21 }}
          SHOW_ID: ${{ secrets.SHOW_ID }}
          SHOW_ID2: ${{ secrets.SHOW_ID2 }}
          PIN_MID: ${{ inputs.pin_mid }}
          MIDS: ${{ inputs.mids }}
          WORKERS: ${{ inputs.workers }}
          EP_ID: ${{ inputs.ep_id }}
          EP_IDS: ${{ inputs.ep_ids }}
          LINK_IDS: ${{ inputs.link_ids }}
          PUB: ${{ inputs.pub }}
          EXP_H: ${{ inputs.exp_h }}
          MOVIE_ID: ${{ inputs.movie_id }}
          PIN: ${{ inputs.pin }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LINK_ID: ${{ inputs.link_id }}
          OUT_NAME: ${{ inputs.out_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          LIMIT: ${{ inputs.limit }}
        run: python ${{ inputs.script }}
