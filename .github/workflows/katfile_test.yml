name: katfile-test
on:
  workflow_dispatch:
    inputs:
      ep_id:
        description: "episode id (default: Mushoku S1E20)"
        required: false
        default: "6825c4c70509281774f8fea8"
      challenge_token:
        description: "challengeToken (localStorage se)"
        required: true

# host_raw() repo me tmp/test_playlist.m3u8 PUT karta hai -> write chahiye
permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: deps
        run: pip install -q pycryptodome
      - name: katfile decrypted-playlist test
        env:
          KEY_8:  ${{ secrets.KEY_8 }}
          KEY_10: ${{ secrets.KEY_10 }}
          KEY_11: ${{ secrets.KEY_11 }}
          KEY_12: ${{ secrets.KEY_12 }}
          KEY_14: ${{ secrets.KEY_14 }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EP_ID: ${{ inputs.ep_id }}
          CHALLENGE_TOKEN: ${{ inputs.challenge_token }}
        run: python test_katfile_m3u8.py
