name: e1fix
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          pip install -q telethon pycryptodome pillow
      - name: go
        env:
          KEY_2: ${{ secrets.KEY_2 }}
          KEY_8: ${{ secrets.KEY_8 }}
          KEY_9: ${{ secrets.KEY_9 }}
          KEY_15: ${{ secrets.KEY_15 }}
          KEY_16: ${{ secrets.KEY_16 }}
          KEY_17: ${{ secrets.KEY_17 }}
          KEY_18: ${{ secrets.KEY_18 }}
          KEY_20: ${{ secrets.KEY_20 }}
          KEY_21: ${{ secrets.KEY_21 }}
        run: python fix_e1.py
